<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>製品比較 | イヤホン診断</title>
<meta name="description" content="選択したワイヤレスイヤホンをスペックで横並び比較できます。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="logo"><span class="logo-dot"></span>イヤホン診断</a>
    <nav class="site-nav">
      <a href="index.html" class="site-nav-link">トップ</a>
      <a href="quiz.html" class="site-nav-link">診断</a>
      <a href="products.html" class="site-nav-link">製品一覧</a>
      <a href="compare.html" class="site-nav-link is-active">比較</a>
      <a href="ranking.html" class="site-nav-link">ランキング</a>
      <a href="articles.html" class="site-nav-link">特集記事</a>
    </nav>
  </div>
</header>

<main>
  <div class="container compare-page-header">
    <h1>製品比較</h1>
    <p>選択したワイヤレスイヤホンをスペックで横並びに比較できます。</p>
  </div>

  <div id="compareEmptyState" class="container state-block" hidden>
    <p class="state-message">比較する製品が2つ以上選択されていません。製品一覧から比較したい機種を選んでください。</p>
    <div class="state-actions">
      <a href="products.html" class="btn btn-primary">製品一覧へ</a>
    </div>
  </div>

  <div id="compareContent" class="container-wide">
    <div class="compare-table-scroll">
      <table class="compare-table" id="compareTable"></table>
    </div>
  </div>

  <p class="result-note">
    掲載している価格・仕様は2025年時点の参考情報です。最新の価格・仕様は各公式サイトでご確認ください。
  </p>
</main>

<footer class="site-footer">
  <p>本サイトは情報提供のみを目的としており、アフィリエイトリンク等は含まれません。</p>
</footer>

<script src="js/products.js"></script>
<script src="js/icons.js"></script>
<script src="js/compare-tray.js"></script>
<script src="js/compare.js"></script>
</body>
