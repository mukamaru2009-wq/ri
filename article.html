<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>記事詳細 | イヤホン診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="logo"><span class="logo-dot"></span>イヤホン診断</a>
    <nav class="site-nav">
      <a href="index.html" class="site-nav-link">トップ</a>
      <a href="quiz.html" class="site-nav-link">診断</a>
      <a href="products.html" class="site-nav-link">製品一覧</a>
      <a href="compare.html" class="site-nav-link">比較</a>
      <a href="ranking.html" class="site-nav-link">ランキング</a>
      <a href="articles.html" class="site-nav-link is-active">特集記事</a>
    </nav>
  </div>
</header>

<main>

  <div id="articleErrorState" class="container state-block" hidden>
    <p class="state-message">記事が見つかりませんでした。URLをご確認いただくか、記事一覧からお探しください。</p>
    <div class="state-actions">
      <a href="articles.html" class="btn btn-primary">記事一覧を見る</a>
      <a href="index.html" class="btn btn-ghost">トップに戻る</a>
    </div>
  </div>

  <div id="articleContent">
    <div class="container article-topnav">
      <a href="articles.html" class="back-link">← 特集記事一覧に戻る</a>
    </div>

    <article class="container article-detail">
      <header class="article-detail-header">
        <div class="article-detail-icon" id="articleIcon"></div>
        <p class="article-detail-category" id="articleCategory"></p>
        <h1 id="articleTitle"></h1>
        <p class="article-detail-date" id="articleDate"></p>
      </header>

      <div class="article-body" id="articleBody"></div>

      <div class="article-related" id="articleRelatedWrap">
        <h2>この記事に関連する製品</h2>
        <div class="article-related-grid" id="articleRelatedProducts"></div>
      </div>
    </article>

    <p class="result-note container">
      掲載している価格・仕様は2025年時点の参考情報です。最新の価格・仕様は各公式サイトでご確認ください。
    </p>

    <div class="product-footer-nav container">
      <a href="articles.html" class="btn btn-ghost">特集記事一覧へ</a>
      <a href="products.html" class="btn btn-ghost">製品一覧を見る</a>
      <a href="index.html" class="btn btn-ghost">トップに戻る</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>本サイトは情報提供のみを目的としており、アフィリエイトリンク等は含まれません。</p>
</footer>

<script src="js/products.js"></script>
<script src="js/icons.js"></script>
<script src="js/articles.js"></script>
<script src="js/article.js"></script>
</body>
</html>
